<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>gcalsorter</h1>

    <label class="toggle">
      <input type="checkbox" id="enabled" />
      <span>並び替えを有効にする</span>
    </label>

    <p class="status" id="status"></p>

    <h2>現在の順序</h2>
    <ol class="order" id="order"></ol>
    <p class="order-empty" id="order-empty" hidden>
      まだ並び替えていません。日表示の列ヘッダー左上のグリップをドラッグしてください。
    </p>

    <button class="reset" id="reset" type="button">並び順をリセット</button>

    <script src="popup.js"></script>
  </body>
</html>
